name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Available:"; ls -d /Applications/Xcode*.app
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version

      - name: Build Core
        run: swift build
      - name: Run Core tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/moviecut-core-tests.log
        timeout-minutes: 15
      - name: Upload Core test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-failure-log
          path: /tmp/moviecut-core-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Build Mac app
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # G-28 browser reachability/rendering regressions are product-path
      # correctness gates, not best-effort diagnostics. Keep this focused suite
      # blocking even while the broader Mac hosted suite retains its historical
      # best-effort treatment for unrelated host-bootstrap flakes.
      - name: Run G-28 Mac behavior tests (blocking)
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -destination 'platform=macOS' \
            -only-testing:MovieCutMacTests/EffectBrowserInspectorReachabilityTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      # Phase 3 (review 2026-08-26): the full Mac hosted suite is now
      # BLOCKING. It ran clean across the BUG-08 compositor change and the
      # multitrack pixel suites (44/44 locally, repeatedly); the historical
      # best-effort treatment was for host-bootstrap flakes that have not
      # recurred. Demote back to continue-on-error only if a runner-specific
      # flake is demonstrated.
      - name: Run Mac app unit tests (blocking)
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -destination 'platform=macOS' \
            -only-testing:MovieCutMacTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build iOS app (generic, blocking)
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # STAB-06: the single 30-min iOS job previously died mid-run (8 PASS at
  # 1,047.8s then cancelled). Split by measured runtime — the state suites
  # finish in under a second of test time (14 tests / 0.55s local), so they
  # give fast signal while the AVFoundation suites (render/export/pipelines,
  # 48 tests / ~45s local) run as their own serial steps with individual
  # timeouts. Suite names measured locally 2026-08-31.
  ios-fast-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version
      - name: Run iOS state tests (fast signal)
        run: |
          SIM="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          if [ -z "$SIM" ]; then
            echo "::error::no available iPhone simulator"
            exit 1
          fi
          echo "Simulator: $SIM"
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:MovieCutiOSTests/IOSPersistenceTests \
            -only-testing:MovieCutiOSTests/IOSMediaSurvivabilityTests \
            -only-testing:MovieCutiOSTests/IOSSessionStateTests \
            -only-testing:MovieCutiOSTests/IOSUITestHarnessRunScopingTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  ios-av-tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version
      - name: Resolve simulator once
        run: |
          SIM="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          if [ -z "$SIM" ]; then
            echo "::error::no available iPhone simulator"
            exit 1
          fi
          echo "SIM=$SIM" >> "$GITHUB_ENV"
      # The render/export suites are the heavy half (22 tests / ~40s local);
      # they run first with their own timeout so a hang cannot burn the whole
      # job before the lighter pipelines report.
      - name: iOS render/export suites
        timeout-minutes: 20
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:MovieCutiOSTests/IOSCanvasRatioGoldenTests \
            -only-testing:MovieCutiOSTests/IOSAudioMixPipelineTests \
            -only-testing:MovieCutiOSTests/IOSExportEngineBehaviorTests \
            -only-testing:MovieCutiOSTests/IOSExportEngineGateTests \
            -only-testing:MovieCutiOSTests/IOSRenderPlanParityTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: iOS pipeline/accessibility suites
        timeout-minutes: 15
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:MovieCutiOSTests/IOSBeatDetectionTests \
            -only-testing:MovieCutiOSTests/IOSImageClipPipelineTests \
            -only-testing:MovieCutiOSTests/IOSPhase1SurfacesTests \
            -only-testing:MovieCutiOSTests/IOSTransitionPipelineTests \
            -only-testing:MovieCutiOSTests/IOSInspectorAccessibilityContractTests \
            -only-testing:MovieCutiOSTests/IOSReviewP0FixesTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  lint:
    runs-on: macos-15
    if: always()
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Available:"; ls -d /Applications/Xcode*.app
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: High-signal lint gate (blocking)
        run: bash scripts/lint_gate.sh
      - name: Verify doc/command file paths (blocking)
        run: bash scripts/verify_doc_paths.sh
      - name: Verify localization keys (blocking, both platforms)
        run: |
          python3 scripts/verify_localization_keys.py \
            --catalog App/MovieCutMac/Localizable.xcstrings --source-root App/MovieCutMac
          python3 scripts/verify_localization_keys.py \
            --catalog App/MovieCutiOS/Localizable.xcstrings --source-root App/MovieCutiOS
          # L10N-01 (review 2026-08-26): no hardcoded Hangul string literals
          # in the iOS app sources — they bypass the catalog and show Korean
          # in every environment.
          python3 scripts/verify_no_hangul_literals.py
          # Every key in BOTH catalogs must carry an en AND ko translation —
          # a Mac-only fill once slipped through when the iOS catalog change
          # was lost to a concurrent-write race (external review finding).
          python3 - <<'PY'
          import json, sys
          failed = False
          for path in ["App/MovieCutMac/Localizable.xcstrings",
                       "App/MovieCutiOS/Localizable.xcstrings"]:
              strings = json.load(open(path))["strings"]
              for key, entry in strings.items():
                  locs = entry.get("localizations", {})
                  for lang in ("en", "ko"):
                      value = locs.get(lang, {}).get("stringUnit", {}).get("value", "")
                      if not value:
                          print(f"MISSING {lang}: {path} :: {key[:80]}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Report full SwiftLint findings (non-blocking)
        if: always()
        run: swiftlint lint --reporter github-actions-logging . || true
