name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Available:"; ls -d /Applications/Xcode*.app
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version

      - name: Build Core
        run: swift build
      - name: Run Core tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/moviecut-core-tests.log
        timeout-minutes: 15
      - name: Upload Core test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-failure-log
          path: /tmp/moviecut-core-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Build Mac app
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # G-28 browser reachability/rendering regressions are product-path
      # correctness gates, not best-effort diagnostics. Keep this focused suite
      # blocking even while the broader Mac hosted suite retains its historical
      # best-effort treatment for unrelated host-bootstrap flakes.
      - name: Run G-28 Mac behavior tests (blocking)
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -destination 'platform=macOS' \
            -only-testing:MovieCutMacTests/EffectBrowserInspectorReachabilityTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run Mac app unit tests (best-effort)
        continue-on-error: true
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutMac \
            -destination 'platform=macOS' \
            -only-testing:MovieCutMacTests \
            CODE_SIGNING_ALLOWED=NO \
            test || true

      - name: Build iOS app (generic, blocking)
        run: |
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version
      - name: Run iOS unit tests (simulator)
        run: |
          SIM="$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          if [ -z "$SIM" ]; then
            echo "::error::no available iPhone simulator"
            exit 1
          fi
          echo "Simulator: $SIM"
          xcodebuild -project MovieCut.xcodeproj \
            -scheme MovieCutiOS \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:MovieCutiOSTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  lint:
    runs-on: macos-15
    if: always()
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Available:"; ls -d /Applications/Xcode*.app
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: High-signal lint gate (blocking)
        run: bash scripts/lint_gate.sh
      - name: Verify doc/command file paths (blocking)
        run: bash scripts/verify_doc_paths.sh
      - name: Verify localization keys (blocking, both platforms)
        run: |
          python3 scripts/verify_localization_keys.py \
            --catalog App/MovieCutMac/Localizable.xcstrings --source-root App/MovieCutMac
          python3 scripts/verify_localization_keys.py \
            --catalog App/MovieCutiOS/Localizable.xcstrings --source-root App/MovieCutiOS
          # L10N-01 (review 2026-08-26): no hardcoded Hangul string literals
          # in the iOS app sources — they bypass the catalog and show Korean
          # in every environment.
          python3 scripts/verify_no_hangul_literals.py
          # Every key in BOTH catalogs must carry an en AND ko translation —
          # a Mac-only fill once slipped through when the iOS catalog change
          # was lost to a concurrent-write race (external review finding).
          python3 - <<'PY'
          import json, sys
          failed = False
          for path in ["App/MovieCutMac/Localizable.xcstrings",
                       "App/MovieCutiOS/Localizable.xcstrings"]:
              strings = json.load(open(path))["strings"]
              for key, entry in strings.items():
                  locs = entry.get("localizations", {})
                  for lang in ("en", "ko"):
                      value = locs.get(lang, {}).get("stringUnit", {}).get("value", "")
                      if not value:
                          print(f"MISSING {lang}: {path} :: {key[:80]}")
                          failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: Report full SwiftLint findings (non-blocking)
        if: always()
        run: swiftlint lint --reporter github-actions-logging . || true
