name: CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  g26-review-patch:
    if: github.event.pull_request.head.ref == 'feat/g26-master-audio-inspector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g26-master-audio-inspector
      - name: Apply serialized master-preset fix and self-clean
        run: |
          python3 scripts/g26_review_patch3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/g26_review_patch3.py
          git add -- \
            .github/workflows/ci.yml \
            App/MovieCutMac/EditorViewModel.swift \
            App/MovieCutMac/EditorViewModel+Audio.swift \
            App/MovieCutMac/InspectorPanel.swift \
            Tests/MovieCutCoreTests/MasterAudioInspectorStaticContractTests.swift
          git add -u -- scripts/g26_review_patch3.py
          git commit -m "fix(audio): serialize rapid master preset selections"
          git push origin HEAD:feat/g26-master-audio-inspector
