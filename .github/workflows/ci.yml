name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/motion-tracking-recovery-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motion-tracking-recovery-v1
      - name: Apply recovery accounting fixes and self-clean
        run: |
          python3 scripts/motion_tracking_recovery_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/motion_tracking_recovery_patch.py 'scripts/g26?'
          git add -- .github/workflows/ci.yml Tests/MovieCutCoreTests/MotionTrackingProviderTests.swift Tests/MovieCutCoreTests/MotionTrackingAnalysisPerfTests.swift
          git add -u -- scripts/motion_tracking_recovery_patch.py 'scripts/g26?'
          git commit -m "test(tracking): account for fail-closed recovery states"
          git push origin HEAD:feat/motion-tracking-recovery-v1
