name: CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/motion-tracking-recovery-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motion-tracking-recovery-v1
          fetch-depth: 0
      - name: Apply measured recovery fix
        run: |
          python3 scripts/apply_motion_tracking_recovery_fix.py
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -f .github/workflows/one-shot-recovery-patch.yml scripts/apply_motion_tracking_recovery_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
                  Sources/MovieCutCore/Analysis/MotionTrackingProvider.swift \
                  Sources/MovieCutCore/Analysis/MotionTrackingTemplateMatcher.swift \
                  Tests/MovieCutCoreTests/MotionTrackingProviderTests.swift
          git commit -m "fix(tracking): re-anchor after full occlusion"
          git push origin HEAD:feat/motion-tracking-recovery-v1
