name: G26 Review Patch

on:
  push:
    branches: [feat/g26-master-audio-inspector]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/g26-master-audio-inspector

      - name: Apply reviewed G-26 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"{label}: start marker missing")
              j = text.find(end, i)
              if j < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:i] + replacement + text[j:]

          # 1) Playback preview: when a project-level master chain is active,
          # use the same graph-rendered master mix as export and insert it as
          # the composition's single audio track. Off/nil keeps the legacy mix.
          path = Path("App/MovieCutMac/Playback/PlaybackEngine.swift")
          s = path.read_text()

          s = replace_once(
              s,
              """        var audioMixInputParameters: [AVMutableAudioMixInputParameters] = []\n        // G-25 Inc 9 audio solo: any soloed audio-capable track silences\n        // every non-solo track's AUDIO (video keeps rendering).\n        let anyTrackSoloed = project.timeline.tracks.contains { $0.isSolo && $0.kind != .text }\n\n        for track in renderingTracks(for: project).sorted(by: { $0.zIndex < $1.zIndex }) {\n""",
              """        var audioMixInputParameters: [AVMutableAudioMixInputParameters] = []\n        let renderTracks = renderingTracks(for: project)\n        // G-26 inspector parity: once a project-level master chain is active,\n        // Preview consumes the graph-rendered master mix exactly like export.\n        // Off/nil deliberately keeps the established per-track AVAudioMix path.\n        let usesGraphMasterAudio = project.masterAudioProcessing != nil\n        // G-25 Inc 9 audio solo: any soloed audio-capable track silences\n        // every non-solo track's AUDIO (video keeps rendering).\n        let anyTrackSoloed = project.timeline.tracks.contains { $0.isSolo && $0.kind != .text }\n\n        for track in renderTracks.sorted(by: { $0.zIndex < $1.zIndex }) {\n""",
              "playback renderTracks/master gate",
          )

          s = replace_once(
              s,
              """                let audioCompositionTrack = (track.isMuted || (anyTrackSoloed && !track.isSolo)) ? nil : try makeCompositionTrack(\n                    in: composition,\n                    mediaType: .audio\n                )\n""",
              """                let audioCompositionTrack: AVMutableCompositionTrack?\n                if usesGraphMasterAudio || track.isMuted || (anyTrackSoloed && !track.isSolo) {\n                    audioCompositionTrack = nil\n                } else {\n                    audioCompositionTrack = try makeCompositionTrack(\n                        in: composition,\n                        mediaType: .audio\n                    )\n                }\n""",
              "video embedded audio bypass",
          )

          s = replace_once(
              s,
              """            case .audio:\n                guard !track.isMuted, !(anyTrackSoloed && !track.isSolo) else { continue }\n""",
              """            case .audio:\n                // The graph master mix already contains every audio-capable\n                // track; inserting legacy clip audio here would double it.\n                guard !usesGraphMasterAudio else { continue }\n                guard !track.isMuted, !(anyTrackSoloed && !track.isSolo) else { continue }\n""",
              "audio track graph bypass",
          )

          graph_insert = """        // G-26 Preview↔Export audio parity: with a master chain enabled,\n        // render the same graph mix export uses and install it as Preview's\n        // SINGLE audio track. The temp AAC joins the composition-build owned\n        // URL set, so cancellation/failure/next rebuild cleans it together\n        // with reverse/image renders; the generation guard still controls\n        // whether this composition can become the active player item.\n        if usesGraphMasterAudio,\n           let graphAudioURL = try await renderGraphPreviewAudio(\n               for: project,\n               audioProcessing: audioProcessing,\n               tracks: renderTracks\n           ) {\n            temporaryReverseRenderURLs.append(graphAudioURL)\n            let graphAudioAsset = AVURLAsset(url: graphAudioURL)\n            if let graphAudioTrack = try await graphAudioAsset.loadTracks(withMediaType: .audio).first {\n                let trackRange = try await graphAudioTrack.load(.timeRange)\n                if trackRange.duration > .zero {\n                    let previewAudioTrack = try makeCompositionTrack(in: composition, mediaType: .audio)\n                    try previewAudioTrack.insertTimeRange(trackRange, of: graphAudioTrack, at: .zero)\n                }\n            }\n        }\n\n"""
          s = replace_once(
              s,
              "        let sortedVideoCompositionTracks = videoCompositionTracks.sorted { $0.zIndex > $1.zIndex }\n",
              graph_insert + "        let sortedVideoCompositionTracks = videoCompositionTracks.sorted { $0.zIndex > $1.zIndex }\n",
              "graph preview insertion",
          )

          helper = """    /// Renders Preview's project-level master audio through the same graph\n    /// implementation used by export. The graph renderer is nonisolated async;\n    /// AAC encoding is explicitly detached so the MainActor-owned player does\n    /// not synchronously encode the whole timeline.\n    private func renderGraphPreviewAudio(\n        for project: Project,\n        audioProcessing: ClipAudioProcessingOptions,\n        tracks: [Track]\n    ) async throws -> URL? {\n        let mix: AudioGraphSourceAudio\n        do {\n            mix = try await GraphMixRenderer.renderMix(\n                project: project,\n                eqPresetsByClipId: audioProcessing.eqPresets,\n                trimToAudibleSpan: false,\n                tracks: tracks\n            )\n        } catch GraphMixRenderer.RenderError.noAudio {\n            return nil\n        }\n\n        try Task.checkCancellation()\n        let url = FileManager.default.temporaryDirectory\n            .appendingPathComponent(\"MovieCutGraphPreview-\\(UUID().uuidString).m4a\")\n        do {\n            try await Task.detached(priority: .userInitiated) {\n                try AudioGraphAacEncoder.encode(mix, to: url)\n            }.value\n            try Task.checkCancellation()\n            return url\n        } catch {\n            try? FileManager.default.removeItem(at: url)\n            throw error\n        }\n    }\n\n"""
          s = replace_once(
              s,
              "    private func temporaryImageRenderURL(for clip: Clip) -> URL {\n",
              helper + "    private func temporaryImageRenderURL(for clip: Clip) -> URL {\n",
              "graph preview helper",
          )
          path.write_text(s)

          # 2) Loudness result freshness: every committed project mutation\n          # advances a revision and clears the cached reading. This covers\n          # command dispatch, undo, redo and preset transitions.\n          path = Path("App/MovieCutMac/EditorViewModel.swift")
          s = path.read_text()
          s = replace_once(
              s,
              """    var masterLoudness: AudioGraphLoudness.Measurement?\n    var isMeasuringMasterLoudness = false\n    var masterLoudnessError: String?\n""",
              """    var masterLoudness: AudioGraphLoudness.Measurement?\n    var isMeasuringMasterLoudness = false\n    var masterLoudnessError: String?\n    /// Increments whenever a committed project snapshot changes. A loudness\n    /// render captures this revision so an older async result cannot overwrite\n    /// a newer edit / undo / redo state.\n    @ObservationIgnored var masterLoudnessRevision: UInt64 = 0\n""",
              "loudness revision storage",
          )
          s = replace_once(
              s,
              """    func refreshFromSession() async throws {\n        currentProject = await session.snapshot()\n        await refreshFlattenedTimeline(for: currentProject)\n""",
              """    func refreshFromSession() async throws {\n        let previousProject = currentProject\n        currentProject = await session.snapshot()\n        if currentProject != previousProject {\n            masterLoudnessRevision &+= 1\n            masterLoudness = nil\n            masterLoudnessError = nil\n        }\n        await refreshFlattenedTimeline(for: currentProject)\n""",
              "refresh invalidation",
          )
          path.write_text(s)

          # 3) Measurement uses a value snapshot plus revision guard on success\n          # and errors; preset setter still uses the normal command path.\n          path = Path("App/MovieCutMac/EditorViewModel+Audio.swift")
          s = path.read_text()
          start = "    func measureMasterLoudness() async {\n"
          end = "    #if DEBUG || MOVIECUT_HARNESS\n"
          replacement = """    func measureMasterLoudness() async {\n        guard !isMeasuringMasterLoudness else { return }\n        isMeasuringMasterLoudness = true\n        masterLoudnessError = nil\n        let measuredProject = currentProject\n        let measuredRevision = masterLoudnessRevision\n        let options = buildAudioProcessingOptions()\n        defer { isMeasuringMasterLoudness = false }\n\n        func isStillCurrent() -> Bool {\n            measuredRevision == masterLoudnessRevision && measuredProject == currentProject\n        }\n\n        do {\n            let mix = try await GraphMixRenderer.renderMix(\n                project: measuredProject,\n                eqPresetsByClipId: options.eqPresets\n            )\n            let measurement = AudioGraphLoudness.measure(mix)\n            guard isStillCurrent() else { return }\n            masterLoudness = measurement\n        } catch GraphMixRenderer.RenderError.noAudio {\n            guard isStillCurrent() else { return }\n            masterLoudnessError = NSLocalizedString(\n                \"This project has no audio to measure.\", comment: \"\"\n            )\n        } catch {\n            guard isStillCurrent() else { return }\n            masterLoudnessError = error.localizedDescription\n        }\n    }\n\n"""
          s = replace_between(s, start, end, replacement, "measurement revision guard")
          path.write_text(s)

          # 4) Regression contracts: product path must use graph audio only when\n          # the master chain is enabled, and stale async measurements must be\n          # invalidated centrally rather than only by the picker setter.\n          Path("Tests/MovieCutCoreTests/MasterAudioPreviewParityStaticContractTests.swift").write_text(r'''import Foundation
import Testing

@Suite("G-26 Master Audio Preview Parity StaticContract")
struct MasterAudioPreviewParityStaticContractTests {
    private func source(_ path: String) throws -> String {
        try String(contentsOfFile: path, encoding: .utf8)
    }

    @Test("master-enabled preview installs the graph mix as one audio track")
    func masterEnabledPreviewUsesGraphMix() throws {
        let playback = try source("App/MovieCutMac/Playback/PlaybackEngine.swift")

        #expect(playback.contains("let usesGraphMasterAudio = project.masterAudioProcessing != nil"))
        #expect(playback.contains("let graphAudioURL = try await renderGraphPreviewAudio"))
        #expect(playback.contains("GraphMixRenderer.renderMix("))
        #expect(playback.contains("tracks: tracks"))
        #expect(playback.contains("MovieCutGraphPreview-"))
        #expect(playback.contains("try previewAudioTrack.insertTimeRange(trackRange, of: graphAudioTrack, at: .zero)"))
    }

    @Test("master-enabled preview suppresses legacy per-track audio while Off retains it")
    func masterGateSeparatesGraphAndLegacyPaths() throws {
        let playback = try source("App/MovieCutMac/Playback/PlaybackEngine.swift")

        #expect(playback.contains("if usesGraphMasterAudio || track.isMuted || (anyTrackSoloed && !track.isSolo)"))
        #expect(playback.contains("guard !usesGraphMasterAudio else { continue }"))
        #expect(playback.contains("applyAudioVolumeAndFades("))
        #expect(playback.contains("let mutableAudioMix = AVMutableAudioMix()"))
    }
}
''')

          Path("Tests/MovieCutCoreTests/MasterAudioLoudnessFreshnessStaticContractTests.swift").write_text(r'''import Foundation
import Testing

@Suite("G-26 Master Loudness Freshness StaticContract")
struct MasterAudioLoudnessFreshnessStaticContractTests {
    private func source(_ path: String) throws -> String {
        try String(contentsOfFile: path, encoding: .utf8)
    }

    @Test("session refresh invalidates measurements across edits undo and redo")
    func refreshInvalidatesMeasurement() throws {
        let viewModel = try source("App/MovieCutMac/EditorViewModel.swift")
        #expect(viewModel.contains("masterLoudnessRevision &+= 1"))
        #expect(viewModel.contains("masterLoudness = nil"))
        #expect(viewModel.contains("masterLoudnessError = nil"))
    }

    @Test("async measurement commits only for its captured project revision")
    func asyncMeasurementHasRevisionGuard() throws {
        let audio = try source("App/MovieCutMac/EditorViewModel+Audio.swift")
        #expect(audio.contains("let measuredProject = currentProject"))
        #expect(audio.contains("let measuredRevision = masterLoudnessRevision"))
        #expect(audio.contains("measuredRevision == masterLoudnessRevision && measuredProject == currentProject"))
        #expect(audio.contains("guard isStillCurrent() else { return }"))
    }
}
''')

          # The workflow is a one-shot remote patch harness; remove it from the
          # resulting commit so no permanent privileged automation is added.
          Path(".github/workflows/g26-review-patch.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            App/MovieCutMac/Playback/PlaybackEngine.swift \
            App/MovieCutMac/EditorViewModel.swift \
            App/MovieCutMac/EditorViewModel+Audio.swift \
            Tests/MovieCutCoreTests/MasterAudioPreviewParityStaticContractTests.swift \
            Tests/MovieCutCoreTests/MasterAudioLoudnessFreshnessStaticContractTests.swift
          git add -u -- .github/workflows/g26-review-patch.yml
          git commit -m "fix(audio): keep master preview and meter state coherent"
          git push origin HEAD:feat/g26-master-audio-inspector
