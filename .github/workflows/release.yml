name: Release
on:
  workflow_dispatch: {}

jobs:
  app-store-archive:
    # S5: manual release pipeline. Fails LOUD when credentials are absent —
    # per the review, a release job must never silently skip or pass without
    # a real signed archive. Trigger this only from a release tag/commit after
    # nightly gates are green.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Select the NEWEST Xcode installed on the runner. The historical pin
          # to Xcode_16.app crashed its swift-frontend on this codebase (no
          # diagnostics — batch compiler crash), and the dev/release toolchain
          # is Xcode 26.5. CI should verify the toolchain we actually ship
          # with; the macOS 14/iOS 17 minimums are enforced by availability
          # gates in the code, not by compiling with an old compiler.
          NEWEST="20 20 12 61 79 80 81 701 33 98 100 204 250 395 398 399 400ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Available:"; ls -d /Applications/Xcode*.app
          echo "Selecting: "
          sudo xcode-select -s "/Contents/Developer"
          swift --version

      # Secrets come from the repo's Actions secrets once configured.
      # Missing team id → the script exits 1 with instructions (fail-loud).
      - name: Archive + export (Mac App Store)
        env:
          MOVIECUT_TEAM_ID: ${{ secrets.MOVIECUT_TEAM_ID }}
        run: bash scripts/release.sh

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MovieCut-appstore-export
          path: build/release/export/
          retention-days: 7
