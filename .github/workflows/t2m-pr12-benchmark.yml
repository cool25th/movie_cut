name: T2-M PR12 Benchmark

on:
  push:
    branches: [feat/motion-tracking-recovery-v1]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/motion-tracking-recovery-v1

      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version

      - name: Same-binary legacy vs recovery T2-M
        run: |
          set -o pipefail
          MOVIECUT_T2M_AB=1 swift test -c release --filter MotionTrackingSameBinaryPerfTests 2>&1 | tee /tmp/t2m-same-binary.log

      - name: Summarize
        if: always()
        run: grep -E '^T2M_SAME_BINARY' /tmp/t2m-same-binary.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2m-pr12-same-binary
          path: /tmp/t2m-same-binary.log
          if-no-files-found: error
          retention-days: 3
