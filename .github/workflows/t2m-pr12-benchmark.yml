name: T2-M PR12 Benchmark

on:
  push:
    branches: [feat/motion-tracking-recovery-v1]

jobs:
  benchmark:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          swift --version

      - name: Prepare baseline worktree
        run: |
          git worktree add /tmp/moviecut-t2m-base af34d3ae37858ed99bfdfa35124aa3fc65067133

      - name: Measure baseline main
        working-directory: /tmp/moviecut-t2m-base
        run: |
          set -o pipefail
          echo "T2M_COMPARE role=baseline sha=af34d3ae37858ed99bfdfa35124aa3fc65067133"
          MOVIECUT_T2M_REPEATS=5 bash scripts/run_t2m_motion_tracking.sh 2>&1 | tee /tmp/t2m-baseline.log

      - name: Measure PR head
        run: |
          set -o pipefail
          echo "T2M_COMPARE role=head sha=$(git rev-parse HEAD)"
          MOVIECUT_T2M_REPEATS=5 bash scripts/run_t2m_motion_tracking.sh 2>&1 | tee /tmp/t2m-head.log

      - name: Summarize comparison
        if: always()
        run: |
          echo "=== BASELINE ==="
          grep -E 'T2M_AGG|T2M_OCC' /tmp/t2m-baseline.log || true
          echo "=== HEAD ==="
          grep -E 'T2M_AGG|T2M_OCC' /tmp/t2m-head.log || true

      - name: Upload T2-M comparison logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t2m-pr12-comparison
          path: |
            /tmp/t2m-baseline.log
            /tmp/t2m-head.log
          if-no-files-found: warn
          retention-days: 3
