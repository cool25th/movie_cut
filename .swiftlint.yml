included:
  - Sources
  - App
  - Tests

excluded:
  - .build
  - .swiftpm

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional
  - override_in_extension
  - private_outlet
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - type_name

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 60
  error: 100
