name: MovieCut
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MovieCut:
    path: .
targets:
  MovieCutMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/MovieCutMac
        excludes:
          - Resources/**/*.wav
    resources:
      - path: App/MovieCutMac/Resources
        includes:
          - "**/*.wav"
    # Info.plist is hand-maintained (custom UTExportedTypeDeclarations for
    # drag-and-drop + microphone usage). It is referenced via INFOPLIST_FILE and
    # intentionally NOT generated by xcodegen, so `xcodegen generate` never
    # clobbers those keys. Do not re-add an `info:` block here.
    dependencies:
      - package: MovieCut
        product: MovieCutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviecut.mac
        INFOPLIST_FILE: App/MovieCutMac/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  MovieCutiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/MovieCutiOS
      - path: Sources/MovieCutCore
    resources:
      - path: App/MovieCutMac/Resources
        includes:
          - "**/*.wav"
    # Hand-maintained Info.plist (see MovieCutMac note). Referenced via
    # INFOPLIST_FILE; not generated by xcodegen.
    dependencies:
      - package: MovieCut
        product: MovieCutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviecut.ios
        INFOPLIST_FILE: App/MovieCutiOS/Info.plist
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  MovieCutCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/MovieCutCoreTests
    dependencies:
      - package: MovieCut
        product: MovieCutCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  MovieCutMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/MovieCutMacUITests
    dependencies:
      - target: MovieCutMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moviecut.mac.uitests
        TEST_TARGET_NAME: MovieCutMac
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  MovieCutMac:
    build:
      targets:
        MovieCutMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MovieCutMacUITests
